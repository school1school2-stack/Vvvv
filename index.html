<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النموذج (15) المطور - أ/ عبدالعزيز الفيفي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --maroon: #800000; --gold: #d4af37; --dark: #333; 
            --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--dark); }
        
        #protection-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: var(--gold); z-index: 999999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        .quiz-card { background: var(--white); width: 100%; max-width: 950px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border-top: 15px solid var(--maroon); padding: 35px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 30px; padding-bottom: 20px; }
        
        .status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #f9f9f9; padding: 15px 25px; border-radius: 15px; border: 1px solid #eee; }
        .timer-box { font-weight: 900; font-size: 1.5rem; width: 60px; height: 60px; border: 4px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .timer-warn { background: var(--wrong); color: white; border-color: #000; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .q-text { font-size: 1.6rem; font-weight: bold; margin-bottom: 30px; text-align: center; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .opt { padding: 20px; border: 2px solid #e0e0e0; border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: 600; background: #fff; text-align: center; font-size: 1.2rem; }
        .opt:hover { border-color: var(--gold); background: #fffdf5; transform: translateY(-3px); }
        .ok-opt { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .no-opt { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }

        .feedback { margin-top: 25px; padding: 20px; border-radius: 15px; display: none; background: #f0f4f1; border-right: 8px solid var(--correct); }
        .btn-action { background: var(--maroon); color: var(--gold); padding: 15px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
        .hidden { display: none !important; }
        
        .log-item { padding: 20px; margin-bottom: 15px; border-radius: 12px; border-right: 12px solid; background: #fff; border: 1px solid #eee; }
        .ok { border-right-color: var(--correct); }
        .no { border-right-color: var(--wrong); }
        .watermark { font-size: 0.7rem; color: #ccc; text-align: left; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="protection-mask">
    <h1>🔒 محتوى محمي</h1>
    <p>حقوق الملكية الفكرية محفوظة للأستاذ عبدالعزيز الفيفي. يمنع النسخ.</p>
</div>

<div class="quiz-card" id="main-frame">
    <div class="header">
        <h3 id="sig" style="margin:0; color:var(--maroon);">أ / عبدالعزيز الفيفي - خبير القدرات</h3>
        <h2 style="margin:10px 0;">النموذج (15) المطور: مهارة الاستبعاد والدقة</h2>
    </div>

    <div id="intro-page" style="text-align: center;">
        <input type="text" id="u-name" placeholder="أدخل اسمك الثلاثي للمتابعة..." style="width: 80%; padding: 20px; border-radius: 12px; border: 2px solid var(--gold); text-align: center; font-size: 1.2rem; margin-bottom: 30px; outline: none;">
        <br><button class="btn-action" onclick="start()">بدأ الاختبار السحابي 🚀</button>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="status">
            <div>الطالب: <span id="n-display" style="color:var(--maroon); font-weight:bold;"></span></div>
            <div id="q-counter" style="font-weight:bold;"></div>
            <div id="timer" class="timer-box">45</div>
        </div>
        <div id="q-area" class="q-text"></div>
        <div id="opt-area" class="options-grid"></div>
        <div id="fb-area" class="feedback">
            <strong id="fb-head"></strong>
            <p id="fb-body" style="margin:10px 0 0;"></p>
        </div>
        <div style="text-align:center;">
            <button id="next-btn" class="btn-action hidden" onclick="goNext()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="final-page" class="hidden">
        <div style="text-align: center; background: var(--maroon); color: var(--gold); padding: 40px; border-radius: 20px; margin-bottom: 30px;">
            <h1 id="final-score" style="font-size: 4rem; margin:0;"></h1>
            <p id="final-msg" style="font-size: 1.2rem;"></p>
        </div>
        <h3>📝 سجل الأداء التعليمي:</h3>
        <div id="final-log"></div>
        <div style="text-align:center;"><button class="btn-action" onclick="location.reload()">إعادة المحاولة 🔄</button></div>
    </div>
</div>

<script>
    // تهيئة الربط بالسحابة
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const OWNER = "أ / عبدالعزيز الفيفي - خبير القدرات";
    function checkSafe() {
        const s = document.getElementById('sig');
        if(!s || s.innerText.trim() !== OWNER) {
            document.getElementById('protection-mask').style.display = 'flex';
            document.getElementById('main-frame').style.display = 'none';
        }
    }
    setInterval(checkSafe, 1000);

    const questions = [
        {q: "ريش : طائر", opts: ["شعر : ثدييات", "جلد : إنسان", "وبر : إبل", "صوف : غنم"], ans: "شعر : ثدييات", tip: "الريش يغطي الطائر، والشعر يغطي الثدييات كقاعدة عامة.", cat: "تناظر"},
        {q: "ماء : حياة", opts: ["نوم : راحة", "أكل : شبع", "هواء : تنفس", "نار : حرق"], ans: "نوم : راحة", tip: "الماء سبب للحياة، والنوم سبب للراحة.", cat: "تناظر"},
        {q: "قلم : كتابة", opts: ["مفتاح : فتح", "سكين : قطع", "إبرة : خياطة", "ريشة : رسم"], ans: "مفتاح : فتح", tip: "القلم أداة وظيفتها الكتابة، والمفتاح وظيفته الفتح.", cat: "تناظر"}
    ];

    let current = 0, score = 0, timerObj, list = [], user = "", log = [];

    function start() {
        user = document.getElementById('u-name').value;
        if(!user.trim()) return alert("يرجى إدخال الاسم.");
        document.getElementById('n-display').innerText = user;
        document.getElementById('intro-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        list = questions.sort(() => Math.random() - 0.5);
        load();
    }

    function load() {
        if(current >= list.length) return finish();
        const data = list[current];
        document.getElementById('q-counter').innerText = `سؤال ${current+1} / ${list.length}`;
        document.getElementById('q-area').innerText = data.q;
        document.getElementById('fb-area').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        const area = document.getElementById('opt-area');
        area.innerHTML = '';
        [...data.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement('div');
            b.className = 'opt'; b.innerText = o;
            b.onclick = () => check(o, b);
            area.appendChild(b);
        });
        startT();
    }

    function check(sel, el) {
        clearInterval(timerObj);
        const data = list[current];
        const isOk = (sel === data.ans);
        if(isOk) score++;
        
        document.querySelectorAll('.opt').forEach(b => {
            b.onclick = null;
            if(b.innerText === data.ans) b.classList.add('ok-opt');
            else if(b.innerText === sel) b.classList.add('no-opt');
        });
        
        const f = document.getElementById('fb-area');
        f.style.display = 'block';
        document.getElementById('fb-head').innerText = isOk ? "✅ إجابة صحيحة" : "❌ إجابة خاطئة";
        document.getElementById('fb-body').innerText = data.tip;
        document.getElementById('next-btn').classList.remove('hidden');
        log.push({q: data.q, ok: isOk, correct: data.ans, tip: data.tip, cat: data.cat});
    }

    function startT() {
        let s = 45;
        const t = document.getElementById('timer');
        t.innerText = s; t.classList.remove('timer-warn');
        timerObj = setInterval(() => {
            s--; t.innerText = s;
            if(s <= 10) t.classList.add('timer-warn');
            if(s <= 0) { clearInterval(timerObj); check("N/A", null); }
        }, 1000);
    }

    function goNext() { current++; load(); }

    function finish() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('final-page').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${list.length}`;
        document.getElementById('final-msg').innerText = `انتهى التحدي يا ${user}! تم إرسال تقريرك للسحابة بنجاح.`;
        
        const logBox = document.getElementById('final-log');
        logBox.innerHTML = '';
        log.forEach((item, i) => {
            const d = document.createElement('div');
            d.className = `log-item ${item.ok?'ok':'no'}`;
            d.innerHTML = `<div class="watermark">أ/ عبدالعزيز الفيفي</div><strong>س${i+1}: ${item.q}</strong><br>الجواب الصحيح: ${item.correct}<br><small>💡 ${item.tip}</small>`;
            logBox.appendChild(d);
        });

        // --- نص أمر الربط بالسحابة (تمت الإضافة هنا بحذر) ---
        db.collection("student_results").add({
            name: user,
            score: score,
            total: list.length,
            details: log.map(l => ({ question: l.q, isCorrect: l.ok, category: l.cat })),
            time: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => console.log("Cloud Error:", err));
    }
</script>
</body>
</html>
