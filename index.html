<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النموذج (5) المطور - أ/ عبدالعزيز الفيفي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --primary: #212121; --secondary: #b19410; --accent: #ffc107; 
            --bg: #f5f5f5; --white: #ffffff; --correct: #1b5e20; --wrong: #b71c1c;
            --feedback-bg: #fffde7;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: #333; user-select: none; }
        .quiz-card { background: var(--white); width: 100%; max-width: 950px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border-top: 15px solid var(--secondary); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 3px double var(--secondary); margin-bottom: 25px; padding-bottom: 20px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fafafa; padding: 15px; border-radius: 12px; border: 1px solid #ddd; }
        .q-badge { background: var(--primary); color: var(--accent); padding: 8px 20px; border-radius: 50px; font-weight: bold; }
        .timer-circle { font-weight: 900; font-size: 1.3rem; width: 60px; height: 60px; border: 4px solid var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .passage-box { background: #fffde7; padding: 25px; border-radius: 15px; border-right: 10px solid var(--secondary); margin-bottom: 25px; line-height: 2; font-size: 1.15rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .opt-btn { padding: 20px; border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: 600; background: #fff; text-align: center; font-size: 1.1rem; }
        .opt-btn:hover { border-color: var(--secondary); background: #fefcf0; transform: translateY(-2px); }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .feedback-panel { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; background: var(--feedback-bg); border-right: 8px solid var(--correct); }
        .btn-main { background: var(--primary); color: var(--accent); padding: 18px 50px; border: 2px solid var(--secondary); border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
        .log-item { padding: 15px; margin-bottom: 10px; border-radius: 10px; border-right: 10px solid; background: #fff; border: 1px solid #eee; font-size: 0.9rem; position: relative; }
        .log-ok { border-right-color: var(--correct); }
        .log-no { border-right-color: var(--wrong); }
        .watermark { position: absolute; bottom: 5px; left: 10px; font-size: 0.7rem; color: #ccc; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="quiz-card">
    <div class="header">
        <h3 style="margin:0; color:var(--secondary);">أ / عبدالعزيز الفيفي</h3>
        <h2 style="margin:10px 0;">نموذج (5) المطور - المراجعة الشاملة</h2>
    </div>

    <div id="start-screen" style="text-align: center;">
        <p style="font-size: 1.2rem; color: #555;">يرجى كتابة اسمك الثلاثي لبدء الاختبار</p>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك هنا..." style="width: 80%; padding: 18px; border-radius: 12px; border: 2px solid var(--secondary); text-align: center; font-size: 1.2rem; margin-bottom: 25px; outline: none;">
        <br><button class="btn-main" onclick="startQuiz()">ابدأ الاختبار الآن 🚀</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <div>👤 الطالب: <span id="display-name" style="color: var(--secondary); font-weight: bold;"></span></div>
            <div class="q-badge" id="display-q-idx"></div>
            <div id="display-timer" class="timer-circle">45</div>
        </div>
        <div id="display-text" class="passage-box hidden"></div>
        <div id="display-question" style="font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; text-align: center;"></div>
        <div id="display-options" class="options-grid"></div>
        <div id="feedback-panel" class="feedback-panel">
            <b id="fb-title" style="display: block; margin-bottom: 8px;"></b>
            <div id="fb-desc"></div>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button id="next-btn" class="btn-main hidden" onclick="handleNext()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div style="text-align: center; background: var(--primary); color: var(--accent); padding: 40px; border-radius: 20px; margin-bottom: 30px;">
            <h1 id="res-score" style="font-size: 4rem; margin:0;"></h1>
            <p id="res-msg" style="font-size: 1.3rem; color: #fff;"></p>
        </div>
        <h3>📚 تقرير الأداء التفصيلي:</h3>
        <div id="res-logs"></div>
    </div>
</div>

<script>
    // إعدادات Firebase من صورتك المرفقة
    var firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    [cite_start]// البيانات مأخوذة من ملفك الأصلي [cite: 53-78]
    const rawData = [
        { q: "ريش : طائر", opts: ["شعر : ثدييات", "جلد : إنسان", "وبر : إبل", "صوف : غنم"], ans: "شعر : ثدييات", tip: "الريش يغطي الطائر، والشعر يغطي الثدييات.", cat: "تناظر" },
        { q: "ماء : حياة", opts: ["نوم : راحة", "أكل : شبع", "هواء : تنفس", "نار : حرق"], ans: "نوم : راحة", tip: "الماء ضروري للحياة، والنوم ضروري للراحة.", cat: "تناظر" },
        { q: "فصل : مدرسة", opts: ["غصن : شجرة", "غرفة : فندق", "لاعب : فريق", "كتاب : مكتبة"], ans: "غرفة : فندق", tip: "الفصل جزء من المدرسة، والغرفة جزء من الفندق.", cat: "تناظر" },
        { q: "قلم : كتابة", opts: ["مفتاح : فتح", "سكين : قطع", "إبرة : خياطة", "ريشة : رسم"], ans: "مفتاح : فتح", tip: "القلم للكتابة والمفتاح للفتح.", cat: "تناظر" },
        { q: "أسد : عرين", opts: ["صقر : وكر", "نحلة : خلية", "إنسان : منزل", "جمل : مراح"], ans: "صقر : وكر", tip: "الأسد يسكن العرين والصقر يسكن الوكر.", cat: "تناظر" },
        { q: "قائد : جيش", opts: ["مدير : موظفين", "معلم : طلاب", "مدرب : لاعبين", "أب : أسرة"], ans: "مدير : موظفين", tip: "القائد يدير الجيش والمدير يدير الموظفين.", cat: "تناظر" },
        { q: "شمس : ضياء", opts: ["وردة : رائحة", "نار : دفء", "مطر : زرع", "كهرباء : إنارة"], ans: "نار : دفء", tip: "الشمس تعطي الضياء والنار تعطي الدفء.", cat: "تناظر" },
        { q: "سفينة : مرسى", opts: ["طائرة : مدرج", "سيارة : موقف", "قطار : محطة", "خيل : إسطبل"], ans: "طائرة : مدرج", tip: "السفينة تقف في المرسى والطائرة في المدرج.", cat: "تناظر" },
        { q: "إن طول ........ في عيوب الآخرين، يجعلك ........ عن إصلاح عيوبك.", opts: ["التفكير - تغفل", "الحديث - تسرع", "النظر - تهتم", "البحث - تنسى"], ans: "التفكير - تغفل", tip: "الانشغال بالناس يلهي عن النفس.", cat: "إكمال جمل" },
        { q: "الاعتذار لا يعني دائماً أنك على ........ ، بل يعني أنك تقدر ........ أكثر من كبريائك.", opts: ["خطأ - العلاقة", "صواب - المال", "حق - الوقت", "يقين - الناس"], ans: "خطأ - العلاقة", tip: "الاعتذار للحفاظ على الروابط.", cat: "إكمال جمل" },
        { q: "من زاد حياؤه زاد طمعه، ومن كان له حياء كان له وقار.", opts: ["حياؤه", "طمعه", "وقار", "زاد"], ans: "طمعه", tip: "الخطأ في 'طمعه'؛ لأن الحياء يقلل الطمع.", cat: "خطأ سياقي" },
        { text: "تعتبر أشجار المانغروف نظاماً دفاعياً طبيعياً...", q: "الوظيفة المزدوجة للمانغروف هي:", opts: ["حماية السواحل وحماية الحياة البحرية", "إنتاج الخشب", "جذب السياح", "تبريد الجو"], ans: "حماية السواحل وحماية الحياة البحرية", tip: "حماية التربة ومأوى للأسماك.", cat: "استيعاب" },
        { q: "المفردة الشاذة: مكة - المدينة - القدس - الرياض", opts: ["مكة", "المدينة", "القدس", "الرياض"], ans: "الرياض", tip: "الرياض عاصمة، والبقية مدن مقدسة.", cat: "مفردة شاذة" }
    ];

    let currentQ = 0, scoreCount = 0, timerObj, mixedData = [], sName = "", logsList = [];

    function startQuiz() {
        sName = document.getElementById('userNameInput').value;
        if(!sName.trim()) return alert("يرجى كتابة اسمك الثلاثي.");
        document.getElementById('display-name').innerText = sName;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        mixedData = rawData.sort(() => Math.random() - 0.5); 
        loadQuestion();
    }

    function loadQuestion() {
        if(currentQ >= mixedData.length) return endQuiz();
        const item = mixedData[currentQ];
        document.getElementById('display-q-idx').innerText = `السؤال ${currentQ + 1} / ${mixedData.length}`;
        document.getElementById('display-question').innerText = item.q;
        document.getElementById('feedback-panel').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        const txtBox = document.getElementById('display-text');
        if(item.text) { txtBox.innerText = item.text; txtBox.classList.remove('hidden'); }
        else { txtBox.classList.add('hidden'); }

        const optBox = document.getElementById('display-options');
        optBox.innerHTML = '';
        [...item.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement('div');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => checkResult(o, b);
            optBox.appendChild(b);
        });
        runTimer();
    }

    function checkResult(sel, el) {
        clearInterval(timerObj);
        const item = mixedData[currentQ];
        const isOk = (sel === item.ans);
        document.querySelectorAll('.opt-btn').forEach(b => {
            b.onclick = null;
            if(b.innerText === item.ans) b.classList.add('correct');
            else if(b.innerText === sel) b.classList.add('wrong');
        });
        if(isOk) scoreCount++;
        const p = document.getElementById('feedback-panel');
        p.style.display = 'block';
        document.getElementById('fb-title').innerText = isOk ? "إجابة صحيحة ✅" : "إجابة خاطئة ❌";
        document.getElementById('fb-desc').innerText = item.tip;
        document.getElementById('next-btn').classList.remove('hidden');
        logsList.push({ q: item.q, cat: item.cat, state: isOk?'ok':'no', correct: item.ans, tip: item.tip });
    }

    function runTimer() {
        let t = 45;
        const d = document.getElementById('display-timer');
        d.innerText = t;
        timerObj = setInterval(() => {
            t--; d.innerText = t;
            if(t <= 0) { clearInterval(timerObj); checkResult("تخطى الوقت", null); }
        }, 1000);
    }

    function handleNext() { currentQ++; loadQuestion(); }

    function endQuiz() {
        // --- الجزء الأهم: إرسال تقرير التحليل للوحة التحكم ---
        const detailedAnalysis = logsList.map(log => ({
            question: log.q,
            category: log.cat,
            isCorrect: log.state === 'ok'
        }));

        db.collection("student_results").add({
            name: sName,
            score: scoreCount,
            total: mixedData.length,
            model_name: "النموذج الخامس (5)",
            details: detailedAnalysis, // هذا هو الحقل الذي ستحلله لوحة التحكم
            time: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => console.log("Data sent!"));

        [cite_start]// عرض التقرير للطالب [cite: 93-94]
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-score').innerText = `${scoreCount} / ${mixedData.length}`;
        document.getElementById('res-msg').innerText = `أحسنت يا ${sName}! تم حفظ نتيجتك وتحليلها بنجاح.`;
        
        const box = document.getElementById('res-logs');
        box.innerHTML = '';
        logsList.forEach((l, i) => {
            const div = document.createElement('div');
            div.className = `log-item ${l.state==='ok'?'log-ok':'log-no'}`;
            div.innerHTML = `<div class="watermark">© أ/ عبدالعزيز الفيفي</div><strong>س${i+1}: [${l.cat}] ${l.q}</strong><br>الجواب: ${l.correct}<br><small>💡 ${l.tip}</small>`;
            box.appendChild(div);
        });
    }
</script>
</body>
</html>
