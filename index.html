<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النموذج (5) المطور - أ/ عبدالعزيز الفيفي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --primary: #212121; --secondary: #b19410; --accent: #ffc107; 
            --bg: #f5f5f5; --white: #ffffff; --correct: #1b5e20; --wrong: #b71c1c;
            --feedback-bg: #fffde7;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: #333; margin: 0; }
        .quiz-card { background: var(--white); width: 100%; max-width: 950px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border-top: 15px solid var(--secondary); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 3px double var(--secondary); margin-bottom: 25px; padding-bottom: 20px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fafafa; padding: 15px; border-radius: 12px; border: 1px solid #ddd; }
        .q-badge { background: var(--primary); color: var(--accent); padding: 8px 20px; border-radius: 50px; font-weight: bold; }
        .timer-circle { font-weight: 900; font-size: 1.3rem; width: 60px; height: 60px; border: 4px solid var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .passage-box { background: #fffde7; padding: 25px; border-radius: 15px; border-right: 10px solid var(--secondary); margin-bottom: 25px; line-height: 2; font-size: 1.15rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .opt-btn { padding: 20px; border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: 600; background: #fff; text-align: center; font-size: 1.1rem; }
        .opt-btn:hover { border-color: var(--secondary); background: #fefcf0; transform: translateY(-2px); }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .feedback-panel { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; background: var(--feedback-bg); border-right: 8px solid var(--correct); }
        .btn-main { background: var(--primary); color: var(--accent); padding: 18px 50px; border: 2px solid var(--secondary); border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
        .log-item { padding: 15px; margin-bottom: 10px; border-radius: 10px; border-right: 10px solid; background: #fff; border: 1px solid #eee; font-size: 0.9rem; }
        .log-ok { border-right-color: var(--correct); }
        .log-no { border-right-color: var(--wrong); }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="quiz-card">
    <div class="header">
        <h3 style="margin:0; color:var(--secondary);">أ / عبدالعزيز الفيفي</h3>
        <h2 style="margin:10px 0;">نموذج (5) المطور - 40 سؤالاً شاملة</h2>
    </div>

    <div id="start-screen" style="text-align: center;">
        <p style="font-size: 1.2rem;">أهلاً بك. هذا النموذج يحتوي على 40 سؤالاً تغطي كافة مهارات القسم اللفظي.</p>
        <input type="text" id="userNameInput" placeholder="اكتب اسمك الثلاثي..." style="width: 80%; padding: 18px; border-radius: 12px; border: 2px solid var(--secondary); text-align: center; font-size: 1.2rem; margin-bottom: 25px; outline: none;">
        <br><button class="btn-main" onclick="startQuiz()">ابدأ المراجعة الختامية 🚀</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <div>الطالب: <span id="display-name" style="color: var(--secondary); font-weight: bold;"></span></div>
            <div class="q-badge" id="display-q-idx"></div>
            <div id="display-timer" class="timer-circle">45</div>
        </div>
        <div id="display-text" class="passage-box hidden"></div>
        <div id="display-question" style="font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; text-align: center;"></div>
        <div id="display-options" class="options-grid"></div>
        <div id="feedback-panel" class="feedback-panel">
            <b id="fb-title" style="display: block; margin-bottom: 8px;"></b>
            <div id="fb-desc"></div>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button id="next-btn" class="btn-main hidden" onclick="handleNext()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div style="text-align: center; background: var(--primary); color: var(--accent); padding: 40px; border-radius: 20px; margin-bottom: 30px;">
            <h1 id="res-score" style="font-size: 4rem; margin:0;"></h1>
            <p id="res-msg" style="font-size: 1.3rem; color: #fff;"></p>
        </div>
        <h3>مراجعة الإجابات:</h3>
        <div id="res-logs"></div>
    </div>
</div>

<script>
    // Firebase Config
    var firebaseConfig = {

        projectId: "aztlg-494c3",

    const rawData = [
        { q: "ريش : طائر", opts: ["شعر : ثدييات", "جلد : إنسان", "وبر : إبل", "صوف : غنم"], ans: "شعر : ثدييات", tip: "الريش يغطي الطائر، والشعر يغطي الثدييات كفئة عامة." },
        { q: "ماء : حياة", opts: ["نوم : راحة", "أكل : شبع", "هواء : تنفس", "نار : حرق"], ans: "نوم : راحة", tip: "الماء ضروري للحياة، والنوم ضروري للراحة." },
        { q: "فصل : مدرسة", opts: ["غصن : شجرة", "غرفة : فندق", "لاعب : فريق", "كتاب : مكتبة"], ans: "غرفة : فندق", tip: "علاقة جزء من كل مكاني؛ الفصل في المدرسة والغرفة في الفندق." },

        { q: "أسد : عرين", opts: ["صقر : وكر", "نحلة : خلية", "إنسان : منزل", "جمل : مراح"], ans: "صقر : وكر", tip: "الأسد يسكن العرين والصقر يسكن الوكر." },
        { q: "قائد : جيش", opts: ["مدير : موظفين", "معلم : طلاب", "مدرب : لاعبين", "أب : أسرة"], ans: "مدير : موظفين", tip: "القائد يدير الجيش والمدير يدير الموظفين." },
        { q: "شمس : ضياء", opts: ["وردة : رائحة", "نار : دفء", "مطر : زرع", "كهرباء : إنارة"], ans: "نار : دفء", tip: "الشمس تعطي الضياء والنار تعطي الدفء." },
        { q: "سفينة : مرسى", opts: ["طائرة : مدرج", "سيارة : موقف", "قطار : محطة", "خيل : إسطبل"], ans: "طائرة : مدرج", tip: "السفينة تقف في المرسى والطائرة في المدرج." },

        { q: "الحياة مثل ........ ، إذا لم تتقدم فيها فستبقى في ........", opts: ["السباق - الخلف", "النهر - مكانك", "الدراجة - الأسفل", "المدرسة - البيت"], ans: "السباق - الخلف", tip: "الحياة تتطلب الحركة المستمرة للأمام." },
        { q: "الأخلاق هي ........ التي تطل منها على ........ العالم.", opts: ["النافذة - جمال", "المرآة - حقيقة", "اللغة - قلوب", "البوابة - كنوز"], ans: "النافذة - جمال", tip: "الأخلاق تحسن رؤيتنا للحياة وللعالم." },
        { q: "لا تجعل ........ الماضي يفسد ........ الحاضر.", opts: ["أحزان - أفراح", "ذكريات - أحلام", "فشل - فرص", "غبار - هواء"], ans: "أحزان - أفراح", tip: "لا تترك حزن الماضي يقتل فرحة اليوم." },
        { q: "من زاد حياؤه زاد طمعه، ومن كان له حياء كان له وقار.", opts: ["حياؤه", "طمعه", "وقار", "زاد"], ans: "طمعه", tip: "الحياء يمنع الطمع ولا يزيده." },
        { q: "يجب عليك أن تبتسم دائماً، لأن الابتسامة تجعل القلوب تبتعد عنك.", opts: ["تبتسم", "دائماً", "تجعل", "تبتعد"], ans: "تبتعد", tip: "الابتسامة تقرب القلوب ولا تبعدها." },
        { q: "العظمة ليست في ألا تسقط أبداً، بل في أن تبقى ساقطاً كلما سقطت.", opts: ["العظمة", "تسقط", "تبقى", "ساقطاً"], ans: "تبقى", tip: "العظمة في النهوض بعد السقوط." },
        { q: "الناجح هو الذي يغلق فمه قبل أن يغلق الناس آذانهم، ويفتح أذنيه قبل أن يفتح الناس أفواههم.", opts: ["الناجح", "يغلق فمه", "يغلق الناس", "أفواههم"], ans: "يغلق الناس", tip: "الصواب 'يفتح الناس آذانهم'." },
        { q: "العمل بجد هو الطريق الوحيد للفشل، لذا يجب عليك الكسل لتنجح.", opts: ["بجد", "الوحيد", "للفشل", "الكسل"], ans: "للفشل", tip: "الجد طريق النجاح." },
        { q: "الصدق صفة قبيحة، يجب على كل إنسان أن يتحلى بها لينال رضا الله.", opts: ["الصدق", "قبيحة", "إنسان", "يتحلى"], ans: "قبيحة", tip: "الصدق صفة حميدة وجميلة." },
        { text: "أشجار المانغروف تمتص قوة الأمواج وتمنع تآكل التربة، وتوفر مأوى للأسماك.", q: "الوظيفة المزدوجة للمانغروف هي:", opts: ["حماية السواحل وحماية البيئة البحرية", "إنتاج الخشب والثمار", "جذب السياح", "تبريد الجو"], ans: "حماية السواحل وحماية البيئة البحرية", tip: "حماية التربة (سواحل) ومأوى للأسماك (بيئة بحرية)." },
        { text: "اللغة العربية تمتاز بالاشتقاق، مما يمنحها مرونة في توليد المصطلحات الحديثة.", q: "الاشتقاق يمنح اللغة العربية:", opts: ["مرونة هائلة", "صعوبة بالغة", "جموداً", "ندرة مفردات"], ans: "مرونة هائلة", tip: "الاشتقاق يعني القدرة على توليد كلمات جديدة." },
        { text: "هرمون الميلاتونين يفرز في الظلام، ويتأثر سلباً بضوء الشاشات.", q: "ما الذي يقلل جودة النوم حسب النص؟", opts: ["ضوء الشاشات", "الظلام", "الميلاتونين", "الهدوء"], ans: "ضوء الشاشات", tip: "ضوء الشاشات يمنع إفراز هرمون النوم." },
        { text: "الذكاء الاصطناعي يحلل البيانات الضخمة لكنه يفتقر للحس الإبداعي البشري.", q: "يتفوق البشر على الذكاء الاصطناعي في:", opts: ["الحس الإبداعي", "سرعة الحساب", "تخزين البيانات", "العمل المستمر"], ans: "الحس الإبداعي", tip: "الإبداع والعاطفة ميزة بشرية." },
        { text: "تحلية المياه تهدف لسد العجز، مع التوجه للطاقة الشمسية لخفض التكلفة.", q: "الهدف الاقتصادي المذكور هو:", opts: ["خفض التكلفة", "سد العجز", "زيادة السكان", "بناء المحطات"], ans: "خفض التكلفة", tip: "خفض التكلفة هو الهدف المالي (الاقتصادي)." },
        { text: "الاحتراق النفسي ينتج عن تراكم الضغوط ويؤدي لانخفاض الإنتاجية.", q: "الاحتراق النفسي هو:", opts: ["نتيجة لضغوط العمل", "مرض عضوي", "محفز للنجاح", "غضب مؤقت"], ans: "نتيجة لضغوط العمل", tip: "تراكم الضغوط يسبب الاحتراق." },
        { text: "الاستدامة هي تلبية احتياجات الحاضر دون المساس بحقوق الأجيال القادمة.", q: "الاستدامة توازن بين:", opts: ["الحاضر والمستقبل", "الماضي والحاضر", "الغنى والفقر", "العلم والجهل"], ans: "الحاضر والمستقبل", tip: "حق الحاضر وحق الأجيال القادمة (المستقبل)." },
        { text: "القراءة السريعة تتطلب توسيع المدى البصري لزيادة كمية الكلمات في النظرة الواحدة.", q: "توسيع المدى البصري يهدف لـ:", opts: ["زيادة كمية الكلمات المقروءة", "تقوية النظر", "حفظ النص", "تحسين الخط"], ans: "زيادة كمية الكلمات المقروءة", tip: "كلما اتسع المدى، رأيت كلمات أكثر في وقت أقل." },
        { q: "المفردة الشاذة: مكة - المدينة - القدس - الرياض", opts: ["الرياض", "مكة", "المدينة", "القدس"], ans: "الرياض", tip: "البقية مدن لها قدسية دينية خاصة." },
        { q: "المفردة الشاذة: ذهب - فضة - نحاس - خشب", opts: ["خشب", "ذهب", "فضة", "نحاس"], ans: "خشب", tip: "الخشب ليس معدناً." },
        { q: "المفردة الشاذة: عطارد - المريخ - الزهرة - الشمس", opts: ["الشمس", "عطارد", "المريخ", "الزهرة"], ans: "الشمس", tip: "الشمس نجم، والبقية كواكب." },
        { q: "المفردة الشاذة: أسد - نمر - فهد - أرنب", opts: ["أرنب", "أسد", "نمر", "فهد"], ans: "أرنب", tip: "الأرنب حيوان أليف وعاشب، البقية كواسر." },
        { q: "المفردة الشاذة: جرام - لتر - كيلو - طن", opts: ["لتر", "جرام", "كيلو", "طن"], ans: "لتر", tip: "اللتر للسوائل (حجم)، البقية للأوزان." },
        { q: "ارتباط: ما الكلمة المرتبطة بـ 'صيف'؟", opts: ["مكيف", "معطف", "مطر", "ثلج"], ans: "مكيف", tip: "المكيف يستخدم لمواجهة حرارة الصيف." },
        { q: "ارتباط: 'طائرة : مطار' مثل 'سفينة : ........'", opts: ["ميناء", "بحر", "رصيف", "شراع"], ans: "ميناء", tip: "المطار مكان توقف الطائرة، والميناء مكان توقف السفينة." },
        { q: "ارتباط: ما الكلمة التي لا تنتمي للحمضيات؟", opts: ["موز", "برتقال", "ليمون", "يوسفي"], ans: "موز", tip: "الموز من الفواكه الاستوائية وليس حمضيات." },
        { q: "ارتباط: 'نحلة : خلية' مثل 'أسد : ........'", opts: ["عرين", "غابة", "فريسة", "زئير"], ans: "عرين", tip: "علاقة المسكن." },
        { q: "ارتباط: 'فصل : مدرسة' مثل 'غرفة : ........'", opts: ["فندق", "شارع", "حديقة", "مطعم"], ans: "فندق", tip: "الغرفة جزء من الفندق." },
        { q: "ارتباط: ما الكلمة المرتبطة بـ 'تعليم'؟", opts: ["مدرسة", "مستشفى", "ملعب", "سوق"], ans: "مدرسة", tip: "المدرسة هي بيئة التعليم." }
    ];

    let currentQ = 0, scoreCount = 0, timerObj, mixedData = [], sName = "", logsList = [];

    function startQuiz() {
        sName = document.getElementById('userNameInput').value;
        if(!sName.trim()) return alert("لطفاً، اكتب اسمك أولاً.");
        document.getElementById('display-name').innerText = sName;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        mixedData = rawData.sort(() => Math.random() - 0.5); // خلط الأسئلة
        loadQuestion();
    }

    function loadQuestion() {
        if(currentQ >= mixedData.length) return endQuiz();
        const item = mixedData[currentQ];
        document.getElementById('display-q-idx').innerText = `السؤال ${currentQ + 1} / ${mixedData.length}`;
        document.getElementById('display-question').innerText = item.q;
        document.getElementById('feedback-panel').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        const txtBox = document.getElementById('display-text');
        if(item.text) { txtBox.innerText = item.text; txtBox.classList.remove('hidden'); }
        else { txtBox.classList.add('hidden'); }

        const optBox = document.getElementById('display-options');
        optBox.innerHTML = '';
        [...item.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement('div');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => checkResult(o, b);
            optBox.appendChild(b);
        });
        runTimer();
    }

    function checkResult(sel, el) {
        clearInterval(timerObj);
        const item = mixedData[currentQ];
        const isOk = (sel === item.ans);
        document.querySelectorAll('.opt-btn').forEach(b => {
            b.onclick = null;
            if(b.innerText === item.ans) b.classList.add('correct');
            else if(b.innerText === sel) b.classList.add('wrong');
        });
        if(isOk) scoreCount++;
        const p = document.getElementById('feedback-panel');
        p.style.display = 'block';
        document.getElementById('fb-title').innerText = isOk ? "إجابة صحيحة ✅" : "إجابة خاطئة ❌";
        document.getElementById('fb-title').style.color = isOk ? "var(--correct)" : "var(--wrong)";
        document.getElementById('fb-desc').innerText = item.tip;
        document.getElementById('next-btn').classList.remove('hidden');
        logsList.push({ q: item.q, state: isOk?'ok':'no', correct: item.ans, tip: item.tip });
    }

    function runTimer() {
        let t = 45;
        const d = document.getElementById('display-timer');
        d.innerText = t;
        timerObj = setInterval(() => {
            t--; d.innerText = t;
            if(t <= 0) { clearInterval(timerObj); checkResult("تخطى الوقت", null); }
        }, 1000);
    }

    function handleNext() { currentQ++; loadQuestion(); }

    function endQuiz() {
        // إرسال النتيجة لـ Firebase
        db.collection("student_results").add({
            name: sName,
            score: scoreCount,
            total: mixedData.length,
            time: new Date()
        }).catch(e => console.log("Firebase Error"));

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-score').innerText = `${scoreCount} / ${mixedData.length}`;
        document.getElementById('res-msg').innerText = `تهانينا يا ${sName}! انتهيت من النموذج بنجاح.`;
        
        const box = document.getElementById('res-logs');
        box.innerHTML = '';
        logsList.forEach((l, i) => {
            const div = document.createElement('div');
            div.className = `log-item ${l.state==='ok'?'log-ok':'log-no'}`;
            div.innerHTML = `<strong>س${i+1}: ${l.q}</strong><br>الجواب الصحيح: ${l.correct}<br><small>💡 ${l.tip}</small>`;
            box.appendChild(div);
        });
    }
</script>
</body>
</html>
