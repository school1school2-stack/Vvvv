<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النموذج (5) المطور - أ/ عبدالعزيز الفيفي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --primary: #212121; --secondary: #b19410; --accent: #ffc107; 
            --bg: #f5f5f5; --white: #ffffff; --correct: #1b5e20; --wrong: #b71c1c;
            --feedback-bg: #fffde7;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: #333; margin: 0; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 15px solid var(--secondary); padding: 30px; }
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 15px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f9f9f9; padding: 12px; border-radius: 10px; }
        .timer-circle { font-weight: bold; font-size: 1.2rem; width: 50px; height: 50px; border: 3px solid var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .passage-box { background: #fffde7; padding: 20px; border-radius: 10px; border-right: 8px solid var(--secondary); margin-bottom: 20px; line-height: 1.8; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .opt-btn { padding: 18px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: 600; background: #fff; text-align: center; }
        .opt-btn:hover { border-color: var(--secondary); background: #fefcf0; }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .btn-main { background: var(--primary); color: var(--accent); padding: 15px 40px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        .hidden { display: none !important; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 10px; background: #f0fdf4; border: 1px solid #dcfce7; display: none; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h3 style="color:var(--secondary); margin:0;">أ / عبدالعزيز الفيفي</h3>
        <h2 style="margin:10px 0;">نموذج (5) المطور - المراجعة الختامية</h2>
    </div>

    <div id="start-screen" style="text-align: center;">
        <input type="text" id="userName" placeholder="أدخل اسمك الثلاثي هنا..." style="width: 80%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 2px solid #ddd; font-size: 1.1rem; text-align: center;">
        <br>
        <button class="btn-main" onclick="startQuiz()">ابدأ الاختبار الآن 🚀</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <div id="q-info" style="font-weight: bold;">السؤال: 1 / 40</div>
            <div id="timer" class="timer-circle">45</div>
        </div>
        <div id="passage" class="passage-box hidden"></div>
        <div id="question-text" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 20px;"></div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="next-btn" class="btn-main hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
        <h1 style="font-size: 3rem; color: var(--secondary);" id="final-score">0 / 0</h1>
        <p style="font-size: 1.2rem;">تم إرسال نتيجتك بنجاح للأستاذ عبدالعزيز الفيفي.</p>
        <button class="btn-main" onclick="location.reload()">إعادة الاختبار</button>
    </div>
</div>

<script>
    // إعدادات Firebase
    var firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    
    // تشغيل التطبيق بحذر لضمان الإقلاع
    try {
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
    } catch(e) { console.log("Firebase connection waiting..."); }

    const questions = [
        { q: "ريش : طائر", opts: ["شعر : ثدييات", "جلد : إنسان", "وبر : إبل", "صوف : غنم"], ans: "شعر : ثدييات", tip: "الريش يغطي الطائر، والشعر يغطي الثدييات." },
        { q: "ماء : حياة", opts: ["نوم : راحة", "أكل : شبع", "هواء : تنفس", "نار : حرق"], ans: "نوم : راحة", tip: "الماء ضروري للحياة، والنوم ضروري للراحة." },
        { q: "فصل : مدرسة", opts: ["غصن : شجرة", "غرفة : فندق", "لاعب : فريق", "كتاب : مكتبة"], ans: "غرفة : فندق", tip: "علاقة جزء من كل مكاني." },
        // ... (يمكنك إضافة باقي الأسئلة هنا)
    ];

    let currentIdx = 0, score = 0, timer, timeLeft = 45, studentName = "";

    function startQuiz() {
        studentName = document.getElementById('userName').value;
        if(!studentName.trim()) return alert("فضلاً اكتب اسمك أولاً");
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if(currentIdx >= questions.length) return finishQuiz();
        
        let q = questions[currentIdx];
        document.getElementById('q-info').innerText = `السؤال: ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        q.opts.sort(() => Math.random() - 0.5).forEach(opt => {
            let b = document.createElement('div');
            b.className = 'opt-btn';
            b.innerText = opt;
            b.onclick = () => checkAnswer(opt, b);
            optDiv.appendChild(b);
        });

        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 45;
        document.getElementById('timer').innerText = timeLeft;
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) { clearInterval(timer); checkAnswer('', null); }
        }, 1000);
    }

    function checkAnswer(selected, element) {
        clearInterval(timer);
        let correct = questions[currentIdx].ans;
        let btns = document.querySelectorAll('.opt-btn');
        
        btns.forEach(b => {
            b.onclick = null;
            if(b.innerText === correct) b.classList.add('correct');
            else if(b.innerText === selected) b.classList.add('wrong');
        });

        if(selected === correct) score++;
        
        const fb = document.getElementById('feedback');
        fb.innerHTML = `<b>${selected === correct ? 'إجابة صحيحة' : 'إجابة خاطئة'}</b><br>${questions[currentIdx].tip}`;
        fb.style.display = 'block';
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    function finishQuiz() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        
        // حفظ النتيجة في Firebase
        if(db) {
            db.collection("results").add({
                name: studentName,
                score: score,
                total: questions.length,
                date: new Date()
            }).catch(e => console.log("خطأ في الحفظ"));
        }
    }
</script>

</body>
</html>
