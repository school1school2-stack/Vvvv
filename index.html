<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج الاختبار المطور - أ/ عبدالعزيز الفيفي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --primary: #212121; --secondary: #b19410; --accent: #ffc107; --bg: #f5f5f5; --white: #ffffff; --correct: #1b5e20; --wrong: #b71c1c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; direction: rtl; }
        .quiz-card { background: var(--white); max-width: 900px; margin: auto; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; border-top: 10px solid var(--secondary); }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; background: #f9f9f9; border-radius: 8px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .opt-btn { padding: 15px; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; text-align: center; font-weight: bold; transition: 0.3s; }
        .opt-btn:hover { border-color: var(--secondary); background: #fffcf0; }
        .correct { background: var(--correct) !important; color: white; }
        .wrong { background: var(--wrong) !important; color: white; }
        .btn-main { background: var(--primary); color: var(--accent); padding: 15px 40px; border-radius: 10px; cursor: pointer; border: none; font-weight: bold; font-size: 1.1rem; }
        
        /* تصميم جدول الملخص النهائي (مثل الصورة) */
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        .report-table th, .report-table td { border: 1px solid #eee; padding: 12px; text-align: center; }
        .report-table th { background: #f8f9fa; color: #555; }
        .icon-correct { color: var(--correct); font-weight: bold; }
        .icon-wrong { color: var(--wrong); font-weight: bold; }
        .hidden { display: none; }
        #upload-status { position: fixed; top: 10px; left: 10px; background: var(--correct); color: white; padding: 10px 20px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<div id="upload-status">⏳ جاري إرسال البيانات للسحابة...</div>

<div class="quiz-card">
    <div id="start-screen" style="text-align: center;">
        <h2>مرحباً بك في الاختبار</h2>
        <input type="text" id="userName" placeholder="أدخل اسمك هنا..." style="padding: 15px; width: 70%; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <br><button class="btn-main" onclick="startQuiz()">ابدأ الاختبار</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="status-bar">
            <div>الطالب: <span id="student-name"></span></div>
            <div id="q-counter"></div>
            <div id="timer" style="font-weight: bold; color: var(--wrong);"></div>
        </div>
        <div id="question-text" style="font-size: 1.3rem; font-weight: bold; text-align: center; margin-bottom: 20px;"></div>
        <div id="options-container" class="options-grid"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="next-btn" class="btn-main hidden" onclick="nextQuestion()">السؤال التالي</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div style="text-align: center; padding: 20px; background: var(--primary); color: var(--accent); border-radius: 10px;">
            <h2 id="final-score"></h2>
            <p>تم إرسال نتائجك للتحليل في لوحة التحكم بنجاح.</p>
        </div>
        
        <h3>📊 تقرير أداء الطالب (الملخص التفصيلي)</h3>
        <table class="report-table" id="report-body">
            <thead>
                <tr>
                    <th>#</th>
                    <th>السؤال</th>
                    <th>إجابتك</th>
                    <th>الصحيحة</th>
                    <th>النتيجة</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-main" onclick="location.reload()">إعادة الاختبار 🔄</button>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    [cite_start]// عينة من الأسئلة (سيتم خلطها عشوائياً) [cite: 53-78]
    const questions = [
        { q: "ملاح : طائرة", opts: ["سائق : سيارة", "قبطان : سفينة", "جندي : خندق", "مهندس : مصنع"], ans: "قبطان : سفينة" },
        { q: "خس : ورقيات", opts: ["تفاح : فواكه", "لحم : بروتين", "ماء : سوائل", "حديد : معادن"], ans: "تفاح : فواكه" }
        // يمكنك إضافة بقية الـ 40 سؤالاً هنا
    ];

    let currentIdx = 0, score = 0, userLogs = [], studentName = "", timer;

    function startQuiz() {
        studentName = document.getElementById('userName').value;
        if(!studentName) return alert("يرجى إدخال الاسم");
        document.getElementById('student-name').innerText = studentName;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if(currentIdx >= questions.length) return endQuiz();
        const q = questions[currentIdx];
        document.getElementById('q-counter').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        document.getElementById('next-btn').classList.add('hidden');

        q.opts.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        const q = questions[currentIdx];
        const isCorrect = (selected === q.ans);
        if(isCorrect) score++;
        
        userLogs.push({
            q: q.q,
            userAns: selected,
            correctAns: q.ans,
            status: isCorrect
        });

        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => {
            b.onclick = null;
            if(b.innerText === q.ans) b.classList.add('correct');
            else if(b.innerText === selected) b.classList.add('wrong');
        });
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    function endQuiz() {
        document.getElementById('upload-status').style.display = 'block';
        
        // إرسال البيانات للسحابة (Firebase) للتحليل
        db.collection("student_results").add({
            name: studentName,
            score: score,
            total: questions.length,
            details: userLogs, // هذه هي البيانات التي ستحللها لوحة التحكم
            time: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            document.getElementById('upload-status').innerText = "✅ تم تحديث السحابة بنجاح";
            setTimeout(() => document.getElementById('upload-status').style.display='none', 3000);
        });

        // عرض شاشة النتائج والجدول (كما في صورتك)
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `النتيجة النهائية: ${score} من ${questions.length}`;
        
        const tbody = document.querySelector('#report-body tbody');
        userLogs.forEach((log, i) => {
            const row = `<tr>
                <td>${i+1}</td>
                <td>${log.q}</td>
                <td>${log.userAns}</td>
                <td style="color:var(--correct)">${log.correctAns}</td>
                <td>${log.status ? '<span class="icon-correct">✔️</span>' : '<span class="icon-wrong">❌</span>'}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }
</script>
</body>
</html>
