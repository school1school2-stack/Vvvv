<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النموذج (15) المطور - أ/ عبدالعزيز الفيفي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --maroon: #800000; --gold: #d4af37; --dark: #333; 
            --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--dark); }
        #protection-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: var(--gold); z-index: 999999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .quiz-card { background: var(--white); width: 100%; max-width: 950px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border-top: 15px solid var(--maroon); padding: 35px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 30px; padding-bottom: 20px; }
        .status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #f9f9f9; padding: 15px 25px; border-radius: 15px; border: 1px solid #eee; }
        .timer-box { font-weight: 900; font-size: 1.5rem; width: 60px; height: 60px; border: 4px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .timer-warn { background: var(--wrong); color: white; border-color: #000; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .passage { background: #fffde7; padding: 20px; border-radius: 15px; border-right: 8px solid var(--gold); margin-bottom: 20px; line-height: 1.8; font-size: 1.1rem; }
        .q-text { font-size: 1.5rem; font-weight: bold; margin-bottom: 25px; text-align: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 18px; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: 600; background: #fff; text-align: center; }
        .opt:hover { border-color: var(--gold); background: #fffdf5; }
        .ok-opt { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .no-opt { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .feedback { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; background: #f0f4f1; border-right: 8px solid var(--correct); }
        .btn-action { background: var(--maroon); color: var(--gold); padding: 15px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
        .hidden { display: none !important; }
        .log-item { padding: 15px; margin-bottom: 10px; border-radius: 10px; border-right: 10px solid; background: #fff; border: 1px solid #eee; }
        .ok { border-right-color: var(--correct); }
        .no { border-right-color: var(--wrong); }
        .watermark { font-size: 0.7rem; color: #ccc; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="protection-mask">
    <h1>🔒 محتوى محمي</h1>
    <p>حقوق الملكية الفكرية محفوظة للأستاذ عبدالعزيز الفيفي.</p>
</div>

<div class="quiz-card" id="main-frame">
    <div class="header">
        <h3 id="sig" style="margin:0; color:var(--maroon);">أ / عبدالعزيز الفيفي - خبير القدرات</h3>
        <h2 style="margin:10px 0;">النموذج (15) المطور: مهارة الاستبعاد والدقة</h2>
    </div>

    <div id="intro-page" style="text-align: center;">
        <input type="text" id="u-name" placeholder="أدخل اسمك الثلاثي..." style="width: 80%; padding: 20px; border-radius: 12px; border: 2px solid var(--gold); text-align: center; font-size: 1.2rem; margin-bottom: 25px;">
        <br><button class="btn-action" onclick="start()">بدء الاختبار 🚀</button>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="status">
            <div>الطالب: <span id="n-display" style="color:var(--maroon); font-weight:bold;"></span></div>
            <div id="q-counter"></div>
            <div id="timer" class="timer-box">45</div>
        </div>
        <div id="p-area" class="passage hidden"></div>
        <div id="q-area" class="q-text"></div>
        <div id="opt-area" class="options-grid"></div>
        <div id="fb-area" class="feedback">
            <strong id="fb-head"></strong>
            <p id="fb-body" style="margin:10px 0 0;"></p>
        </div>
        <div style="text-align:center;">
            <button id="next-btn" class="btn-action hidden" onclick="goNext()">التالي ⮕</button>
        </div>
    </div>

    <div id="final-page" class="hidden">
        <div style="text-align: center; background: var(--maroon); color: var(--gold); padding: 40px; border-radius: 20px; margin-bottom: 30px;">
            <h1 id="final-score" style="font-size: 4rem; margin:0;"></h1>
            <p id="final-msg"></p>
        </div>
        <h3>📝 السجل التعليمي وتحليل الأداء:</h3>
        <div id="final-log"></div>
        <div style="text-align:center;"><button class="btn-action" onclick="location.reload()">إعادة 🔄</button></div>
    </div>
</div>

<script>

        projectId: "aztlg-494c3",

        {q: "سفينة : مرسى", opts: ["طائرة : مدرج", "سيارة : موقف", "قطار : محطة", "خيل : إسطبل"], ans: "طائرة : مدرج", tip: "مكان التوقف الرسمي؛ السفينة في المرسى والطائرة في المدرج.", cat: "تناظر"},
        {q: "إن طول ........ في عيوب الآخرين، يجعلك ........ عن إصلاح عيوبك.", opts: ["التفكير - تغفل", "الحديث - تسرع", "النظر - تهتم", "البحث - تنسى"], ans: "التفكير - تغفل", tip: "الانشغال بعيوب الناس يؤدي للغفلة عن الذات.", cat: "إكمال جمل"},
        {q: "الاعتذار لا يعني دائماً أنك على ........ ، بل يعني أنك تقدر ........ أكثر من كبريائك.", opts: ["خطأ - العلاقة", "صواب - المال", "حق - الوقت", "يقين - الناس"], ans: "خطأ - العلاقة", tip: "الاعتذار سمو لتقدير العلاقات الإنسانية.", cat: "إكمال جمل"},
        {q: "من أراد أن ........ فليتعلم كيف ........ أولاً.", opts: ["يقود - يطيع", "يربح - يخسر", "ينجح - يفشل", "يتكلم - يصمت"], ans: "يقود - يطيع", tip: "الانضباط (الطاعة) هو الطريق للقيادة.", cat: "إكمال جمل"},
        {q: "يجب أن تكون نيتك ........ حتى لو كانت ظروفك ........", opts: ["حسنة - سيئة", "صادقة - قاسية", "واضحة - غامضة", "قوية - مهزوزة"], ans: "حسنة - سيئة", tip: "ثبات النية الطيبة رغم صعوبة الظروف.", cat: "إكمال جمل"},
        {q: "الحياة مثل ........ ، إذا لم تتقدم فيها فستبقى في ........", opts: ["السباق - الخلف", "النهر - مكانك", "الدراجة - الأسفل", "المدرسة - البيت"], ans: "السباق - الخلف", tip: "التوقف عن التطور يعني التراجع.", cat: "إكمال جمل"},
        {q: "الأخلاق هي ........ التي تطل منها على ........ العالم.", opts: ["النافذة - جمال", "المرآة - حقيقة", "اللغة - قلوب", "البوابة - كنوز"], ans: "النافذة - جمال", tip: "الأخلاق تحسن رؤيتك للحياة.", cat: "إكمال جمل"},

        {q: "من زاد حياؤه زاد طمعه، ومن كان له حياء كان له وقار.", opts: ["حياؤه", "طمعه", "وقار", "زاد"], ans: "طمعه", tip: "الخطأ في 'طمعه'؛ الحياء يمنع الطمع. التصحيح: 'قل طمعه'.", cat: "خطأ سياقي"},
        {q: "يجب عليك أن تبتسم دائماً، لأن الابتسامة تجعل القلوب تبتعد عنك.", opts: ["تبتسم", "دائماً", "تجعل", "تبتعد"], ans: "تبتعد", tip: "الابتسامة تقرب القلوب ولا تبعدها.", cat: "خطأ سياقي"},

        {p: "تعتبر أشجار المانغروف نظاماً دفاعياً طبيعياً، فهي تمتص قوة الأمواج وتمنع تآكل التربة، وتوفر مأوى آمناً لصغار الأسماك.", q: "الوظيفة المزدوجة للمانغروف في النص هي:", opts: ["حماية السواحل وحماية الحياة البحرية", "إنتاج الخشب والثمار", "جذب السياح وزيادة الأمطار", "تبريد الجو ومنع الرياح"], ans: "حماية السواحل وحماية الحياة البحرية", tip: "النص ذكر دورها الدفاعي للسواحل والمأوى للأسماك.", cat: "استيعاب"},
        {p: "اللغة العربية تمتاز بالاشتقاق، مما يمنحها مرونة هائلة في استيعاب المكتشفات العلمية الحديثة وتوليد المصطلحات.", q: "الاشتقاق في اللغة العربية يؤدي إلى:", opts: ["صعوبتها", "مرونتها", "جمودها", "ندرة مفرداتها"], ans: "مرونتها", tip: "الاشتقاق يولد المرونة حسب النص.", cat: "استيعاب"},

        {p: "الذكاء الاصطناعي يعتمد على تحليل البيانات الضخمة، لكنه يفتقر تماماً للحس الإبداعي والعاطفة البشرية.", q: "تتفوق البشرية على الذكاء الاصطناعي في:", opts: ["سرعة الحساب", "تخزين البيانات", "الحس الإبداعي", "العمل المستمر"], ans: "الحس الإبداعي", tip: "الإبداع والعاطفة ميزة بشرية مفقودة في الآلة.", cat: "استيعاب"},
        {p: "تحلية المياه تهدف لسد العجز المائي نتيجة النمو السكاني، مع التوجه لاستخدام الطاقة الشمسية لخفض التكلفة الاقتصادية.", q: "الهدف الاقتصادي المذكور في النص هو:", opts: ["سد العجز", "خفض التكلفة", "زيادة السكان", "بناء المحطات"], ans: "خفض التكلفة", tip: "استخدام الشمس يهدف لتقليل المصاريف (التكلفة).", cat: "استيعاب"},

        {q: "المفردة الشاذة: مكة - المدينة - القدس - الرياض", opts: ["مكة", "المدينة", "القدس", "الرياض"], ans: "الرياض", tip: "الرياض عاصمة سياسية، والبقية مدن دينية مقدسة.", cat: "مفردة شاذة"},
        {q: "المفردة الشاذة: ذهب - فضة - نحاس - خشب", opts: ["ذهب", "فضة", "نحاس", "خشب"], ans: "خشب", tip: "الخشب ليس معدناً، والبقية معادن.", cat: "مفردة شاذة"},

    let current = 0, score = 0, timerObj, list = [], user = "", log = [];

    function start() {
        user = document.getElementById('u-name').value;
        if(!user.trim()) return alert("لطفاً أدخل الاسم.");
        document.getElementById('n-display').innerText = user;
        document.getElementById('intro-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        list = questions.sort(() => Math.random() - 0.5);
        load();
    }

    function load() {
        if(current >= list.length) return finish();
        const d = list[current];
        document.getElementById('q-counter').innerText = `سؤال ${current+1} / ${list.length}`;
        document.getElementById('q-area').innerText = d.q;
        document.getElementById('fb-area').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        const pa = document.getElementById('p-area');
        if(d.p) { pa.innerText = d.p; pa.classList.remove('hidden'); }
        else { pa.classList.add('hidden'); }

        const oa = document.getElementById('opt-area');
        oa.innerHTML = '';
        [...d.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement('div');
            b.className = 'opt'; b.innerText = o;
            b.onclick = () => check(o, b);
            oa.appendChild(b);
        });
        startT();
    }

    function check(sel, el) {
        clearInterval(timerObj);
        const d = list[current];
        const isOk = (sel === d.ans);
        if(isOk) score++;
        document.querySelectorAll('.opt').forEach(b => {
            b.onclick = null;
            if(b.innerText === d.ans) b.classList.add('ok-opt');
            else if(b.innerText === sel) b.classList.add('no-opt');
        });
        document.getElementById('fb-area').style.display = 'block';
        document.getElementById('fb-head').innerText = isOk ? "✅ رائع!" : "❌ خيرها في غيرها";
        document.getElementById('fb-body').innerText = d.tip;
        document.getElementById('next-btn').classList.remove('hidden');
        log.push({q: d.q, ok: isOk, correct: d.ans, tip: d.tip, cat: d.cat});
    }

    function startT() {
        let s = 45;
        const t = document.getElementById('timer');
        t.innerText = s; t.classList.remove('timer-warn');
        timerObj = setInterval(() => {
            s--; t.innerText = s;
            if(s <= 10) t.classList.add('timer-warn');
            if(s <= 0) { clearInterval(timerObj); check("N/A", null); }
        }, 1000);
    }

    function goNext() { current++; load(); }

    function finish() {
        // إرسال البيانات للسحابة فوراً
        db.collection("student_results").add({
            name: user,
            score: score,
            total: list.length,
            details: log.map(l => ({ question: l.q, isCorrect: l.ok, category: l.cat })),
            time: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => console.log("Cloud Error:", err));

        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('final-page').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${list.length}`;
        document.getElementById('final-msg').innerText = `تهانينا يا ${user}! تم إرسال تقريرك للسحابة بنجاح.`;
        
        const lb = document.getElementById('final-log');
        lb.innerHTML = '';
        log.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = `log-item ${item.ok?'ok':'no'}`;
            div.innerHTML = `<div class="watermark">أ/ عبدالعزيز الفيفي</div><strong>س${i+1}: [${item.cat}] ${item.q}</strong><br>الجواب النموذجي: ${item.correct}<br><small>💡 الشرح: ${item.tip}</small>`;
            lb.appendChild(div);
        });
    }
</script>
</body>
</html>
